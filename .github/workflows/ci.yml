name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      # Modules are added to this list as each layer of the package is cleaned up.
      - name: Lint
        run: >-
          ruff check
          src/pycad/config.py src/pycad/paths.py src/pycad/utils.py
          src/pycad/tp_generator.py src/pycad/library
          src/pycad/node/node.py
          src/pycad/circuit/circuit.py src/pycad/circuit/circuit_loader.py
          src/pycad/circuit/convert.py src/pycad/fault_simulation/fault.py
          src/pycad/node/dft_node.py src/pycad/circuit/dft_circuit.py tests

      - name: Run tests
        run: pytest -v
