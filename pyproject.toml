[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycad"
version = "2.0.0"
description = "Python package for digital circuit analysis, design for test (DFT) and CAD research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "M. Saeed Abrishami" },
  { name = "Ghazal Rafiei" },
]
keywords = ["EDA", "CAD", "DFT", "fault simulation", "ATPG", "STAFAN", "SCOAP", "netlist"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "numpy",
  "networkx",
]

[project.optional-dependencies]
# Statistical static timing analysis
ssta = ["scipy", "matplotlib", "gekko"]
# Analysis and plotting used by experiment scripts
analysis = ["pandas", "matplotlib", "seaborn", "scipy"]
# Graph neural network experiments (gnn/)
gnn = ["torch", "dgl", "torch-geometric", "pandas", "matplotlib", "seaborn"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/msabrishami/DFT"
Issues = "https://github.com/msabrishami/DFT/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "IPT: input node",
  "BUFF: buffer node",
  "NOT: not node",
  "NOR: nor node",
  "OR: or node",
  "NAND: nand node",
  "AND: and node",
  "XOR: xor node",
  "XNOR: xnor node",
  "BRCH: branch node",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
